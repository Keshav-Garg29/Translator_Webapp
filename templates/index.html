<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translator Web App</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Translate Text or Document</h1>
    <p>Enter your text or upload a file to receive a translation.</p>
    <form action="/translate" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label for="email">Email Address (Required)</label>
            <input type="email" id="email" name="email" required placeholder="user@example.com">
        </div>
        <div class="form-group">
            <label for="text">Text to Translate (Optional if file is provided)</label>
            <textarea id="text" name="text" rows="5" placeholder="Enter text here..."></textarea>
        </div>
        <div class="form-group">
            <label for="file">Upload File (.txt, .pdf, .docx) (Optional if text is provided)</label>
            <input type="file" id="file" name="file">
        </div>
        <div class="form-group">
            <label for="target_lang">Target Language</label>
            <select id="target_lang" name="target_lang">
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
            </select>
        </div>
        <button type="submit">Translate & Email Me</button>
    </form>
</body>
</html>
